<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساهر</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --text:#1d1d1b; --muted:#6b6a66; --line:#e2e0da;
          --me:#dbeafe; --saher:#fff; --accent:#0f766e; --err:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --panel:#1f1f1d; --text:#ecebe7; --muted:#9a9993; --line:#33322f;
            --me:#1e3a5f; --saher:#262624; --accent:#2dd4bf; --err:#f97066; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
         font-family:"Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif; font-size:18px; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; flex:1; }
  header small { color:var(--muted); font-size:13px; font-weight:normal; margin-inline-start:8px; }
  button { font:inherit; font-size:15px; padding:6px 14px; border-radius:8px; border:1px solid var(--line);
           background:var(--panel); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; line-height:1.7; border:1px solid var(--line); }
  .user { background:var(--me); align-self:flex-start; }
  .assistant { background:var(--saher); align-self:flex-end; }
  .note { color:var(--muted); font-size:14px; text-align:center; align-self:center; }
  .error { color:var(--err); }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid var(--line); max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; font:inherit; resize:none; padding:10px; border-radius:8px; border:1px solid var(--line);
             background:var(--bg); color:var(--text); height:56px; }
  #send { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ساهر <small>نسخة تجريبية · {{MODEL}} · ما ينحفظ شي</small></h1>
  <button id="reset" type="button">محادثة جديدة</button>
  <button id="quit" type="button">إنهاء</button>
</header>
<main id="log"></main>
<form id="form">
  <textarea id="input" placeholder="اكتب رسالتك… (Enter للإرسال، Shift+Enter لسطر جديد)" autofocus></textarea>
  <button id="send" type="submit">إرسال</button>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"), form = document.getElementById("form");
let history = [], controller = null;

function bubble(cls, text) {
  const d = document.createElement("div");
  d.className = cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function start() { log.innerHTML = ""; bubble("note", "محادثة جديدة. ساهر يتذكر هالمحادثة بس، وتنمسح إذا بدأت من جديد أو سكرت الصفحة."); }

async function send(text) {
  history.push({ role: "user", content: text });
  bubble("msg user", text);
  const out = bubble("msg assistant", "…");
  controller = new AbortController();
  let reply = "";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ messages: history }), signal: controller.signal });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        if (j.message && j.message.content) { reply += j.message.content; out.textContent = reply; log.scrollTop = log.scrollHeight; }
      }
    }
    history.push({ role: "assistant", content: reply });
  } catch (e) {
    if (e.name === "AbortError") return;
    history.pop();
    out.className = "msg assistant error";
    out.textContent = "صار خطأ: " + e.message + " — تأكد إن Ollama شغال وجرب مرة ثانية.";
  } finally { controller = null; }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = ""; send(text);
});
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
document.getElementById("reset").onclick = () => { if (controller) controller.abort(); history = []; start(); input.focus(); };
document.getElementById("quit").onclick = async () => {
  if (controller) controller.abort();
  history = [];
  try { await fetch("/quit", { method: "POST" }); } catch (e) {}
  document.body.innerHTML = '<p style="text-align:center;margin-top:30vh">انتهت المحادثة وانقفل ساهر. تقدر تسكر هالصفحة.</p>';
};
start();
</script>
</body>
</html>
