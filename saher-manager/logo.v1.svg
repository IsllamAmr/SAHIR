      <stop offset="0" stop-color="#123B4A"/>
      <stop offset="1" stop-color="#0A2230"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#saherNight)"/>
  <path d="M10 33 C18 20 46 20 54 33 C46 44 18 44 10 33 Z" fill="none" stroke="#E9DFC7" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M15 24 C24 15 40 15 49 24" fill="none" stroke="#C9A25B" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  <g transform="translate(32 33)">
