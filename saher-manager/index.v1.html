<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساهر للمدراء</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root {
  --bg: #F4F1EA; --surface: #FFFFFF; --surface-2: #F9F7F2; --line: #E3DDD0;
  --text: #1C2A31; --muted: #5E6B70; --brand: #123B4A; --brand-ink: #FFFFFF; --gold: #A9822F;
  --user: #123B4A; --user-ink: #FFFFFF; --ok: #2E7D4F; --warn: #9A5B00; --warn-bg: #FFF4E0;
  --bad: #A23A2A; --bad-bg: #FCEBE7; --mock: #5B3F99; --mock-bg: #EFE9FA; --focus: #C9A25B;
  --shadow: 0 1px 2px rgba(18, 59, 74, .06), 0 4px 16px rgba(18, 59, 74, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C1A21; --surface: #12252E; --surface-2: #162C36; --line: #24414D;
    --text: #E8EEF0; --muted: #9DB0B7; --brand: #1D5468; --brand-ink: #FFFFFF; --gold: #D4B06A;
    --user: #1D5468; --user-ink: #FFFFFF; --ok: #6CC795; --warn: #F0B860; --warn-bg: #33270F;
    --bad: #F08A78; --bad-bg: #3A1C17; --mock: #C2AEF0; --mock-bg: #2A2142; --focus: #D4B06A;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.65 "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  display: flex; flex-direction: column;
}
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 40px; height: 40px; flex: none; }
.brand h1 { margin: 0; font-size: 1.25rem; line-height: 1.2; color: var(--brand); }
@media (prefers-color-scheme: dark) { .brand h1 { color: var(--text); } }
.brand p { margin: 0; font-size: .82rem; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-inline-start: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; padding: 3px 10px;
  border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.ok .dot { background: var(--ok); } .chip.bad .dot { background: var(--bad); } .chip.mock { color: var(--mock); background: var(--mock-bg); border-color: transparent; }
.head-actions { display: flex; gap: 6px; }
.ghost {
  background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: .88rem;
}
.ghost:hover { background: var(--surface-2); }

main { flex: 1; overflow-y: auto; }
#log { max-width: 860px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg .avatar { width: 32px; height: 32px; flex: none; }
.bubble {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; border-start-start-radius: 4px;
  padding: 10px 14px; max-width: min(640px, 100%); white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow);
}
.msg.user { flex-direction: row-reverse; }
.msg.user .bubble { background: var(--user); color: var(--user-ink); border-color: transparent; border-radius: 16px; border-start-end-radius: 4px; }
.msg.user .avatar { display: none; }
.bubble.error { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.bubble .hint { display: block; color: var(--muted); font-size: .85rem; margin-top: 6px; }
.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--gold); }
@keyframes blink { 50% { opacity: 0; } }

.inbox { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.inbox-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; border-start-start-radius: 4px; padding: 10px 14px;
}
.inbox-head strong { font-size: 1rem; }
.inbox-head .meta { color: var(--muted); font-size: .85rem; }
.badge { font-size: .74rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.badge.mock { background: var(--mock-bg); color: var(--mock); border-color: transparent; font-weight: 600; }
.badge.high { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.badge.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.card.risky { border-color: var(--bad); }
.card-top { padding: 12px 14px 8px; display: grid; gap: 2px; }
.card-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.from { font-weight: 600; }
.addr { color: var(--muted); font-size: .82rem; direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }
.date { color: var(--muted); font-size: .82rem; margin-inline-start: auto; white-space: nowrap; }
.subject { font-size: 1.02rem; font-weight: 600; color: var(--brand); overflow-wrap: anywhere; unicode-bidi: plaintext; }
@media (prefers-color-scheme: dark) { .subject { color: var(--gold); } }
.card-body { padding: 4px 14px 12px; display: grid; gap: 8px; }
.field { display: grid; gap: 2px; }
.label { font-size: .78rem; color: var(--muted); font-weight: 600; }
.value { white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; }
.alert { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.draft { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; }
.draft-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.copy { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 8px; padding: 5px 12px; font-size: .85rem; }
.copy:hover { filter: brightness(1.1); }
.small { color: var(--muted); font-size: .8rem; }
.pending { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 8px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

footer { background: var(--surface); border-top: 1px solid var(--line); }
.composer { max-width: 860px; margin: 0 auto; padding: 10px 16px 12px; display: grid; gap: 8px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.primary {
  background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 12px; padding: 8px 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px;
}
.primary:hover { filter: brightness(1.1); }
.primary:disabled, .send:disabled { opacity: .55; cursor: default; filter: none; }
select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; max-width: 100%; }
.row { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; min-width: 0; resize: none; min-height: 46px; max-height: 160px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); overflow-y: hidden;
}
.send { background: var(--gold); color: #1C1405; border: 0; border-radius: 12px; padding: 0 18px; height: 46px; font-weight: 700; }
.stop { background: var(--bad-bg); color: var(--bad); border: 0; border-radius: 12px; padding: 0 16px; height: 46px; font-weight: 600; }
.note { color: var(--muted); font-size: .78rem; text-align: center; }
.note .short { display: none; }
[hidden] { display: none !important; }

@media (max-width: 600px) {
  header { padding: 8px 12px; gap: 8px; }
  .brand img { width: 34px; height: 34px; }
  .brand p { display: none; }
  .chips { order: 3; width: 100%; margin: 0; }
  .head-actions { margin-inline-start: auto; }
  .ghost { padding: 5px 10px; font-size: .82rem; }
  #log { padding: 14px 12px 6px; }
  .msg .avatar { width: 26px; height: 26px; }
  .msg.saher { gap: 6px; }
  .composer { padding: 8px 12px 10px; }
  .date { margin-inline-start: 0; width: 100%; }
  .msg.saher:has(.inbox) > .avatar { display: none; }
  .tools { flex-wrap: nowrap; }
  .tools .primary { padding: 8px 10px; font-size: .9rem; white-space: nowrap; }
  #sourceWrap { flex: 1; min-width: 0; display: flex; }
  #sourceWrap .small { display: none; }
  #sourceWrap select { width: 100%; font-size: .85rem; }
  .note .long { display: none; }
  .note .short { display: inline; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/logo.svg" alt="">
    <div>
      <h1>ساهر</h1>
      <p>مساعدك للبريد والشغل، على جهازك</p>
    </div>
  </div>
  <div class="chips" aria-live="polite">
    <span class="chip" id="chipModel"><span class="dot"></span><span>النموذج</span></span>
    <span class="chip" id="chipN8n"><span class="dot"></span><span>n8n</span></span>
    <span class="chip mock" id="chipTest" hidden>وضع الاختبار</span>
  </div>
  <div class="head-actions">
    <button class="ghost" id="newChat" type="button">محادثة جديدة</button>
    <button class="ghost" id="quit" type="button">إنهاء</button>
  </div>
</header>

<main id="scroller">
  <div id="log" aria-live="polite"></div>
</main>

<footer>
  <div class="composer">
    <div class="tools">
      <button class="primary" id="inboxBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>
        آخر ٥ إيميلات غير مقروءة
      </button>
      <label id="sourceWrap" hidden>
        <span class="small">المصدر:</span>
        <select id="source">
          <option value="mock:normal">تجريبي: ٥ إيميلات</option>
          <option value="mock:empty">تجريبي: صندوق فاضي</option>
          <option value="mock:malicious">تجريبي: إيميلات فيها أوامر خبيثة</option>
          <option value="mock:not_connected">تجريبي: Outlook غير مربوط</option>
          <option value="mock:n8n_down">تجريبي: n8n طافي</option>
          <option value="outlook">Outlook الحقيقي (عن طريق n8n)</option>
        </select>
      </label>
    </div>
    <form class="row" id="form">
      <label for="input" hidden>رسالتك</label>
      <textarea id="input" rows="1" placeholder="اكتب لساهر… (Enter للإرسال، Shift+Enter لسطر جديد)" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit">إرسال</button>
      <button class="stop" id="stop" type="button" hidden>وقف</button>
    </form>
    <div class="note"><span class="long">قراءة فقط: ساهر ما يرسل ولا يحذف ولا ينقل ولا يعلّم أي إيميل كمقروء. الردود اقتراحات تنسخها بنفسك. المحادثة ما تنحفظ.</span><span class="short">قراءة فقط: ما يرسل ولا يحذف ولا يعلّم كمقروء.</span></div>
  </div>
</footer>

<script>
"use strict";
const MODEL = "{{MODEL}}";
const TEST_MODE = {{TEST_MODE}};
const $ = (id) => document.getElementById(id);
const log = $("log"), scroller = $("scroller"), input = $("input");
let history = [];          // what the model sees: {role, content}
let busy = null;           // AbortController of the running request
let generation = 0;        // bumps on "new chat" so late events from an old request are dropped

const ERRORS = {
  n8n_down: ["n8n مو شغال على الجهاز.", "شغّل start-n8n.bat من مجلد n8n واستنى دقيقتين، وبعدها جرّب مرة ثانية."],
  n8n_workflow_off: ["سير العمل «Saher - unread emails (read-only)» مو مفعّل في n8n.", "افتح n8n وفعّله (Publish)، أو شغّل import_into_n8n.bat من مجلد saher-manager\\n8n."],
  not_connected: ["Outlook مو مربوط في n8n للحين، أو انتهى تسجيل الدخول.", "افتح http://localhost:5678 ثم Credentials ثم «Outlook - Saher (read only)» واضغط Connect my account."],
  graph_error: ["مايكروسوفت رفضت طلب قراءة البريد.", "جرّب بعد شوي. إذا تكرر، شيّك على الصلاحيات في n8n."],
  forbidden: ["n8n رفض الطلب لأن مفتاح ساهر ما تطابق.", "شغّل import_into_n8n.bat من جديد قبل ربط Outlook."],
  n8n_error: ["صار خطأ في n8n.", "شيّك على نافذة n8n."],
  model: ["النموذج ما رد.", "تأكد إن Ollama شغال وفيه " + MODEL + "، وبعدها جرّب مرة ثانية."],
  internal: ["صار خطأ داخلي في ساهر.", "جرّب مرة ثانية، وإذا تكرر شيّك على النافذة السوداء."],
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;   // all model and email text goes through textContent, never innerHTML
  return e;
}
function avatar() { const i = el("img", "avatar"); i.src = "/logo.svg"; i.alt = ""; return i; }
function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
function scrollDown(force) { if (force || nearBottom()) scroller.scrollTop = scroller.scrollHeight; }

function addMsg(role, text) {
  const m = el("div", "msg " + (role === "user" ? "user" : "saher"));
  if (role !== "user") m.append(avatar());
  const b = el("div", "bubble", text);
  m.append(b); log.append(m); scrollDown(true);
  return b;
}
function addError(code, detail) {
  const [what, how] = ERRORS[code] || ERRORS.internal;
  const b = addMsg("saher", what);
  b.classList.add("error");
  b.append(el("span", "hint", how));
  if (detail) b.title = detail;
  return b;
}

const dateFmt = new Intl.DateTimeFormat("ar-SA-u-ca-gregory", {
  timeZone: "Asia/Riyadh", weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
function fmtDate(s) { const d = new Date(s); return isNaN(d) ? s : dateFmt.format(d); }

function setBusy(ctrl) {
  busy = ctrl;
  $("send").hidden = !!ctrl; $("stop").hidden = !ctrl;
  $("inboxBtn").disabled = !!ctrl;
}

async function stream(path, body, onEvent, ctrl) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body), signal: ctrl.signal });
  if (!res.ok) throw Object.assign(new Error("HTTP " + res.status), { code: "internal" });
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (line) onEvent(JSON.parse(line));
    }
  }
}

// ---------- chat ----------
const INBOX_INTENT = /(جيب|اعرض|ورني|وريني|شوف|لخص|لخّص|وش|ايش|إيش|show|check|summari[sz]e)[^\n]{0,30}(إيميل|ايميل|الإيميلات|الايميلات|إيميلاتي|ايميلاتي|البريد|بريدي|inbox|e-?mails?|unread)/i;

async function send(text) {
  if (!text || busy) return;
  if (INBOX_INTENT.test(text)) { addMsg("user", text); return loadInbox(text); }
  addMsg("user", text);
  const b = addMsg("saher", ""); b.classList.add("typing");
  const ctrl = new AbortController(), gen = generation;
  setBusy(ctrl);
  let reply = "", failed = false;
  try {
    await stream("/turn", { text, messages: history }, (e) => {
      if (gen !== generation) return;
      if (e.type === "text") { reply += e.delta; b.textContent = reply; scrollDown(); }
      else if (e.type === "error") { failed = true; b.closest(".msg").remove(); addError(e.error, e.detail); }
    }, ctrl);
  } catch (err) {
    if (err.name !== "AbortError" && gen === generation) { failed = true; b.closest(".msg").remove(); addError("internal", String(err)); }
  }
  if (gen !== generation) return;
  b.classList.remove("typing");
  if (!failed && reply.trim()) {
    history.push({ role: "user", content: text }, { role: "assistant", content: reply.trim() });
  } else if (!failed) {
    b.textContent = "(وقفت الرد)";
  }
  setBusy(null);
}

// ---------- inbox ----------
async function loadInbox(askedText) {
  if (busy) return;
  const source = TEST_MODE ? $("source").value : "outlook";
  const isMock = source.startsWith("mock:");
  const m = el("div", "msg saher"); m.append(avatar());
  const box = el("div", "inbox"); m.append(box); log.append(m);
  const head = el("div", "inbox-head");
  const title = el("strong", null, "آخر الإيميلات غير المقروءة");
  const meta = el("span", "meta");
  const pending = el("span", "pending"); pending.append(el("span", "spinner"), el("span", null, "أجيب الإيميلات…"));
  head.append(title);
  if (isMock) head.append(el("span", "badge mock", "تجريبي (mock)، مو من بريدك"));
  head.append(meta, pending);
  box.append(head); scrollDown(true);

  const ctrl = new AbortController(), gen = generation;
  setBusy(ctrl);
  const cards = {}, results = [];
  let list = null, errored = false;
  try {
    await stream("/inbox", { source }, (e) => {
      if (gen !== generation) return;
      if (e.type === "list") {
        list = e.emails;
        if (!list.length) {
          pending.remove();
          box.append(el("div", "bubble", "ما عندك إيميلات غير مقروءة في الوارد. صندوقك نظيف 👌"));
          return;
        }
        meta.textContent = "(" + (list.length === 1 ? "إيميل واحد" : list.length === 2 ? "إيميلين" : list.length.toLocaleString("ar-SA") + " إيميلات") + ")";
        pending.lastChild.textContent = "ألخصها وحدة وحدة…";
        list.forEach((x, i) => { cards[x.id] = card(x, i + 1, isMock); box.append(cards[x.id].root); });
        scrollDown(true);
      } else if (e.type === "email") {
        cards[e.id] && fillCard(cards[e.id], e);
        results.push(e); scrollDown();
      } else if (e.type === "error") {
        errored = true; pending.remove();
        if (list) { Object.values(cards).forEach(c => c.pending && c.pending.isConnected && (c.pending.textContent = "توقف التلخيص.")); }
        const [what, how] = ERRORS[e.error] || ERRORS.internal;
        const b = el("div", "bubble error", what); b.append(el("span", "hint", how));
        if (isMock && /^mock:(n8n_down|not_connected)$/.test(source)) b.append(el("span", "hint", "(هذي حالة تجريبية mock)"));
        b.title = e.detail || ""; box.append(b);
      } else if (e.type === "done") {
        pending.remove();
      }
    }, ctrl);
  } catch (err) {
    if (err.name === "AbortError") { pending.remove(); box.append(el("div", "small", "وقفت التلخيص.")); }
    else if (gen === generation) { errored = true; pending.remove(); const b = el("div", "bubble error", ERRORS.internal[0]); b.append(el("span", "hint", ERRORS.internal[1])); box.append(b); }
  }
  if (gen !== generation) return;
  setBusy(null);
  // Give the chat model the summaries (not the raw emails) so follow-up questions work.
  if (list && results.length) {
    const tag = isMock ? " (بيانات تجريبية mock)" : "";
    const digest = results.map((r, i) => {
      const x = list.find(l => l.id === r.id) || {};
      return (i + 1) + ") من: " + (x.from_name || x.from_address) + " | العنوان: " + x.subject + " | الملخص: " + r.summary +
        (r.action ? " | المطلوب: " + r.action : "") + (r.risky ? " | تنبيه: إيميل مشبوه" : "");
    }).join("\n");
    history.push({ role: "user", content: askedText || "وريني آخر الإيميلات غير المقروءة" },
                 { role: "assistant", content: "هذي ملخصات آخر " + results.length + " إيميلات غير مقروءة" + tag + ":\n" + digest });
  } else if (list && !list.length) {
    history.push({ role: "user", content: askedText || "وريني آخر الإيميلات غير المقروءة" },
                 { role: "assistant", content: "ما فيه إيميلات غير مقروءة في الوارد" + (isMock ? " (تجريبي)" : "") + "." });
  }
}

function card(x, n, isMock) {
  const root = el("article", "card");
  const top = el("div", "card-top");
  const r1 = el("div", "card-row");
  r1.append(el("span", "from", x.from_name || x.from_address || "بدون اسم"));
  if (x.from_name && x.from_address) r1.append(el("span", "addr", x.from_address));
  r1.append(el("span", "date", fmtDate(x.received)));
  const r2 = el("div", "card-row");
  r2.append(el("span", "subject", x.subject || "(بدون عنوان)"));
  if (x.importance === "high") r2.append(el("span", "badge high", "مهم"));
  if (x.has_attachments) r2.append(el("span", "badge", "📎 مرفق"));
  if (isMock) r2.append(el("span", "badge mock", "تجريبي"));
  top.append(r1, r2);
  const body = el("div", "card-body");
  const pending = el("div", "pending"); pending.append(el("span", "spinner"), el("span", null, "ساهر يقرأ…"));
  body.append(pending);
  root.append(top, body);
  root.setAttribute("aria-label", "إيميل " + n);
  return { root, body, pending };
}

function field(label, value) {
  const f = el("div", "field"); f.append(el("span", "label", label), el("span", "value", value)); return f;
}

function fillCard(c, r) {
  c.pending.remove();
  if (r.risky) c.root.classList.add("risky");
  (r.warnings || []).forEach(w => c.body.append(el("div", "alert" + (r.risky ? " bad" : ""), "⚠️ " + w)));
  c.body.append(field("الملخص", r.summary || "ما قدرت ألخصه."));
  if (r.action) c.body.append(field("المطلوب منك", r.action));
  const f = el("div", "field");
  f.append(el("span", "label", "رد مقترح"));
  if (r.risky) {
    f.append(el("span", "value small", "ما اقترحت رد لهذا الإيميل لأنه مشبوه."));
  } else if (r.no_reply || !r.reply) {
    f.append(el("span", "value small", r.no_reply ? "ما يحتاج رد، للعلم بس." : "ما طلع رد واضح، اكتبه بنفسك."));
  } else {
    f.append(el("div", "draft", r.reply));
    const a = el("div", "draft-actions");
    const btn = el("button", "copy", "نسخ الرد"); btn.type = "button";
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(r.reply); btn.textContent = "تم النسخ ✓"; }
      catch { const t = el("textarea"); t.value = r.reply; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); btn.textContent = "تم النسخ ✓"; }
      setTimeout(() => (btn.textContent = "نسخ الرد"), 1800);
    };
    a.append(btn, el("span", "small", "مسودة: راجع القرار والمواعيد اللي بين [ ] قبل ما ترسلها من Outlook."));
    f.append(a);
    if (r.check_facts && r.check_facts.length) {
      f.append(el("div", "alert", "انتبه: هذي مو موجودة في الإيميل، ممكن ساهر اخترعها: " + r.check_facts.join("، ")));
    }
    if (r.check_wording && r.check_wording.length) {
      f.append(el("div", "alert", "راجع صيغة المخاطبة في الرد: " + r.check_wording.join("، ")));
    }
  }
  c.body.append(f);
}

// ---------- page ----------
function welcome() {
  addMsg("saher", "هلا، أنا ساهر. أقدر أجيب لك آخر ٥ إيميلات غير مقروءة من Outlook، وألخصها، وأقترح لك ردود تنسخها بنفسك. وأقدر أسولف معك في أي شي ثاني.\nاضغط الزر تحت، أو اكتب مثلاً: «وش عندي إيميلات؟»");
}
async function refreshStatus() {
  try {
    const s = await (await fetch("/status")).json();
    const set = (id, ok, okText, badText) => { const c = $(id); c.classList.toggle("ok", ok); c.classList.toggle("bad", !ok); c.lastChild.textContent = ok ? okText : badText; };
    set("chipModel", s.model, "ALLaM 7B محلي", "النموذج مو جاهز");
    set("chipN8n", s.n8n, "n8n شغال", "n8n طافي");
  } catch { /* the server stopped */ }
}

$("form").addEventListener("submit", (ev) => { ev.preventDefault(); const t = input.value.trim(); if (!t || busy) return; input.value = ""; autosize(); send(t); });
input.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); } });
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, 160) + "px"; input.style.overflowY = input.scrollHeight > 160 ? "auto" : "hidden"; }
input.addEventListener("input", autosize);
$("stop").onclick = () => busy && busy.abort();
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && busy) busy.abort(); });
$("inboxBtn").onclick = () => loadInbox();
$("newChat").onclick = () => { generation++; if (busy) busy.abort(); setBusy(null); history = []; log.textContent = ""; welcome(); input.focus(); };
$("quit").onclick = async () => {
  if (busy) busy.abort();
  try { await fetch("/quit", { method: "POST" }); } catch {}
  document.body.innerHTML = '<p style="text-align:center;margin-top:20vh;font-size:1.1rem">سكّرت ساهر. تقدر تسكّر هالصفحة.</p>';
};
if (matchMedia("(max-width: 600px)").matches) input.placeholder = "اكتب لساهر…";
if (TEST_MODE) { $("sourceWrap").hidden = false; $("chipTest").hidden = false; }
welcome(); refreshStatus(); setInterval(refreshStatus, 15000);
input.focus();
</script>
