<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساهر</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --text:#1d1d1b; --muted:#6b6a66; --line:#e2e0da;
          --me:#dbeafe; --saher:#fff; --accent:#0f766e; --hot:#c0392b; --err:#b42318; --warn:#fef3c7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --panel:#1f1f1d; --text:#ecebe7; --muted:#9a9993; --line:#33322f;
            --me:#1e3a5f; --saher:#262624; --accent:#2dd4bf; --hot:#e0675a; --err:#f97066; --warn:#3a2f12; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
         font-family:"Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif; font-size:18px; }
  header { display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; flex:1; }
  header small { color:var(--muted); font-size:13px; font-weight:normal; margin-inline-start:8px; }
  button { font:inherit; font-size:15px; padding:6px 14px; border-radius:8px; border:1px solid var(--line);
           background:var(--panel); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #voice { min-width:150px; }
  #voice[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; line-height:1.7; border:1px solid var(--line); }
  .user { background:var(--me); align-self:flex-start; }
  .user.spoken::before { content:"🎙 "; }
  .assistant { background:var(--saher); align-self:flex-end; }
  .note { color:var(--muted); font-size:14px; text-align:center; align-self:center; }
  .times { font-size:12px; color:var(--muted); direction:ltr; align-self:flex-end; font-variant-numeric:tabular-nums; margin-top:-6px; }
  .error { color:var(--err); }
  footer { background:var(--panel); border-top:1px solid var(--line); }
  #review { display:none; max-width:820px; margin:0 auto; padding:8px 16px 0; font-size:14px; color:var(--muted); }
  body.reviewing #review { display:block; }
  body.reviewing textarea { background:var(--warn); }
  form { display:flex; gap:8px; padding:12px 16px; max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; font:inherit; resize:none; padding:10px; border-radius:8px; border:1px solid var(--line);
             background:var(--bg); color:var(--text); height:64px; }
  #send { background:var(--accent); color:#fff; border-color:var(--accent); }
  #talk { min-width:120px; user-select:none; touch-action:none; border:2px solid var(--accent); }
  #talk.on { background:var(--hot); border-color:var(--hot); color:#fff; }
  #stop, #discard { display:none; }
  body.reviewing #discard { display:inline-block; }
  body.busy #stop { display:inline-block; }
  body.busy #send, body.busy #talk, body.busy #discard { display:none; }
</style>
</head>
<body>
<header>
  <h1>ساهر <small>{{SETUP}} · ما ينحفظ شي</small></h1>
  <button id="voice" type="button" aria-pressed="true">🔊 الردود بصوت</button>
  <button id="reset" type="button">محادثة جديدة</button>
  <button id="quit" type="button">إنهاء</button>
</header>
<main id="log"></main>
<footer>
  <div id="review">🎙 هذا اللي سمعته. صحح الكلام إذا فيه غلط، وبعدين اضغط إرسال (أو Enter). Esc يلغيه.</div>
  <form id="form">
    <textarea id="input" placeholder="اكتب رسالتك، أو اضغط مطولاً على المايك وتكلم… (Enter للإرسال، Shift+Enter لسطر جديد)" autofocus></textarea>
    <button id="send" type="submit">إرسال</button>
    <button id="discard" type="button">إلغاء</button>
    <button id="talk" type="button" title="اضغط مطولاً وتكلم، أو اضغط مسافة مطولاً وأنت برا مربع الكتابة">🎙 اضغط وتكلم</button>
    <button id="stop" type="button">وقف</button>
  </form>
</footer>
<script>
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), form = $("form"), talk = $("talk"), voiceBtn = $("voice");
let history = [], controller = null, ctx, stream, source, proc, rec = [], recording = false, playAt = 0, playing = [];
let spoken = false;  // true while the text box holds a transcript you are reviewing

// One switch for every reply, typed or spoken: voiced, or silent (text only).
let speak = true;
try { speak = localStorage.getItem("saher-speak") !== "0"; } catch (e) {}
function showVoice() { voiceBtn.setAttribute("aria-pressed", speak); voiceBtn.textContent = speak ? "🔊 الردود بصوت" : "🔇 الردود صامتة"; }
voiceBtn.onclick = () => { speak = !speak; if (!speak) silence(); showVoice(); try { localStorage.setItem("saher-speak", speak ? "1" : "0"); } catch (e) {} };
showVoice();

function bubble(cls, text) {
  const d = document.createElement("div");
  d.className = cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function start() { log.innerHTML = ""; bubble("note", "محادثة جديدة. اكتب، أو اضغط على المايك وتكلم وراجع اللي سمعته قبل ما ترسله. كله بنفس المحادثة، وتنمسح إذا بدأت من جديد أو سكرت الصفحة."); }
function setReview(on) { spoken = on; document.body.classList.toggle("reviewing", on); }

async function audioCtx() { ctx = ctx || new AudioContext(); await ctx.resume(); return ctx; }
function play(pcmB64, rate) {
  const raw = atob(pcmB64), n = raw.length / 2, buf = ctx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) { let v = raw.charCodeAt(2 * i) | (raw.charCodeAt(2 * i + 1) << 8); if (v >= 32768) v -= 65536; ch[i] = v / 32768; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  const at = Math.max(ctx.currentTime + 0.02, playAt); src.start(at); playAt = at + buf.duration;
  playing.push(src); src.onended = () => { playing = playing.filter(s => s !== src); };
  return at;
}
function silence() { for (const s of playing) { try { s.stop(); } catch (e) {} } playing = []; playAt = 0; }

function to16k(parts, rate) {
  const n = parts.reduce((a, p) => a + p.length, 0), all = new Float32Array(n);
  let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
  const ratio = rate / 16000, out = new Int16Array(Math.floor(n / ratio));
  for (let i = 0; i < out.length; i++) {
    const x = i * ratio, j = Math.floor(x), f = x - j, s = all[j] * (1 - f) + (all[j + 1] || 0) * f;
    out[i] = Math.max(-1, Math.min(1, s)) * 32767;
  }
  return out;
}
function b64(int16) {
  const bytes = new Uint8Array(int16.buffer); let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

// One turn. Every reply is shown as text; it is also voiced when the switch says so.
async function turn(text, wasSpoken) {
  silence();
  bubble("msg user" + (wasSpoken ? " spoken" : ""), text);
  document.body.classList.add("busy");
  const out = bubble("msg assistant", "…"), info = bubble("times", ""), sent = performance.now(), voiced = speak;
  controller = new AbortController();
  let reply = "", firstSound = null, voiceNote = "";
  try {
    if (voiced) await audioCtx();
    const res = await fetch("/turn", { method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
                                       body: JSON.stringify({ text, spoken: wasSpoken, speak: voiced, messages: history }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const e = JSON.parse(line);
        if (e.type === "text") { reply += e.delta; out.textContent = reply; log.scrollTop = log.scrollHeight; }
        else if (e.type === "audio") { if (!speak) continue; const at = play(e.pcm16, e.sample_rate); if (firstSound === null) firstSound = performance.now() - sent + (at - ctx.currentTime) * 1000; }
        else if (e.type === "tts_error") { voiceNote = e.error; }
        else if (e.type === "error") throw new Error(e.error);
        else if (e.type === "done") {
          const t = e.times, f = v => v == null ? null : (v / 1000).toFixed(2) + "s";
          info.textContent = [["first text", f(t.first_text)], ["first audio", f(t.first_audio)], ["full text", f(t.full_text)], ["full reply", f(t.full_reply)],
                              ["heard", f(firstSound)]].filter(x => x[1]).map(x => x.join(" ")).join(" · ");
          if (voiceNote) info.textContent += " · الصوت وقف: " + voiceNote;
        }
      }
    }
    if (reply.trim()) history.push({ role: "user", content: text }, { role: "assistant", content: reply.trim() });
    else { out.remove(); info.remove(); }
  } catch (e) {
    if (e.name === "AbortError") {
      // stopped by you: keep what was said so far, so the conversation still makes sense
      if (reply.trim()) { history.push({ role: "user", content: text }, { role: "assistant", content: reply.trim() }); out.textContent = reply.trim() + " …"; }
      else out.remove();
      info.remove();
    } else {
      out.className = "msg assistant error";
      out.textContent = "صار خطأ: " + e.message + " — تأكد إن Ollama شغال وجرب مرة ثانية.";
    }
  } finally { controller = null; document.body.classList.remove("busy"); input.focus(); }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller || recording) return;
  const wasSpoken = spoken;
  input.value = ""; setReview(false);
  turn(text, wasSpoken);
});
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
input.addEventListener("input", () => { if (!input.value.trim()) setReview(false); });

async function listen() {
  if (recording || controller) return;
  try {
    await audioCtx();
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  } catch (e) { bubble("note error", "ما قدرت أفتح المايك: " + e.message); return; }
  silence();
  source = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(4096, 1, 1);
  rec = [];
  proc.onaudioprocess = e => rec.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(proc); proc.connect(ctx.destination);
  recording = true; talk.classList.add("on"); talk.textContent = "أسمعك… شيل إصبعك";
}
async function heardIt() {
  if (!recording) return;
  recording = false; talk.classList.remove("on");
  source.disconnect(); proc.disconnect();
  const pcm = to16k(rec, ctx.sampleRate);
  if (pcm.length < 16000 * 0.3) { talk.textContent = "🎙 اضغط وتكلم"; return; }  // a tap, not speech
  await review(b64(pcm));
}
// Speech goes to Whisper only; the transcript lands in the text box for you to check before it is sent.
async function review(pcm16) {
  talk.disabled = true; talk.textContent = "أكتب اللي سمعته…";
  try {
    const r = await (await fetch("/transcribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pcm16 }) })).json();
    if (!r.text) { bubble("note", "ما سمعت شي واضح، جرب مرة ثانية."); return; }
    const before = input.value.trim();
    input.value = before ? before + " " + r.text : r.text;
    setReview(true);
    input.focus(); input.setSelectionRange(input.value.length, input.value.length);
  } catch (e) { bubble("note error", "صار خطأ في التعرف على الكلام: " + e.message); }
  finally { talk.disabled = false; talk.textContent = "🎙 اضغط وتكلم"; }
}
function discard() { input.value = ""; setReview(false); input.focus(); }

talk.addEventListener("pointerdown", e => { e.preventDefault(); listen(); });
talk.addEventListener("pointerup", heardIt);
talk.addEventListener("pointerleave", heardIt);
// Space is push-to-talk only while you are not typing.
addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && document.activeElement !== input) { e.preventDefault(); listen(); } });
addEventListener("keyup", e => { if (e.code === "Space" && recording) { e.preventDefault(); heardIt(); } });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (controller) $("stop").click(); else if (spoken) discard();
});

$("discard").onclick = discard;
$("stop").onclick = () => { silence(); if (controller) controller.abort(); };
$("reset").onclick = () => { silence(); if (controller) controller.abort(); history = []; discard(); start(); };
$("quit").onclick = async () => {
  silence(); if (controller) controller.abort();
  history = [];
  if (stream) stream.getTracks().forEach(t => t.stop());
  try { await fetch("/quit", { method: "POST" }); } catch (e) {}
  document.body.innerHTML = '<p style="text-align:center;margin-top:30vh">انتهت المحادثة وانقفل ساهر. تقدر تسكر هالصفحة.</p>';
};
start();
</script>
</body>
</html>
