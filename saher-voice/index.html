<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساهر بالصوت</title>
<style>
  :root { --bg:#f6f4ef; --fg:#1d1d1b; --muted:#6b6a64; --card:#fff; --line:#e3e0d8; --accent:#0f7b5f; --hot:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --fg:#ecebe6; --muted:#9a998f; --card:#21211e; --line:#33332e; --accent:#3fbf95; --hot:#e0675a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; min-height:100vh; display:flex; flex-direction:column; gap:12px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  h1 { font-size:20px; margin:0; }
  small { color:var(--muted); }
  #log { flex:1; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  .msg { padding:10px 14px; border-radius:14px; max-width:85%; background:var(--card); border:1px solid var(--line); white-space:pre-wrap; }
  .user { align-self:flex-start; }
  .assistant { align-self:flex-end; border-color:var(--accent); }
  .times { font-size:12px; color:var(--muted); direction:ltr; text-align:left; align-self:flex-end; font-variant-numeric:tabular-nums; }
  #talk { padding:22px; font-size:20px; border-radius:18px; border:2px solid var(--accent); background:var(--card); color:var(--fg); cursor:pointer; user-select:none; touch-action:none; }
  #talk.on { background:var(--hot); border-color:var(--hot); color:#fff; }
  #talk:disabled { opacity:.5; cursor:wait; }
  button.quiet { background:none; border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:4px 10px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>ساهر بالصوت</h1><small>{{SETUP}}</small></div>
    <div><button class="quiet" id="reset">محادثة جديدة</button> <button class="quiet" id="quit">إنهاء</button></div>
  </header>
  <div id="log"></div>
  <button id="talk">اضغط مطولاً وتكلم (أو اضغط مسافة)</button>
  <small>الأوقات تحت كل رد محسوبة من لحظة ما تشيل إصبعك.</small>
</main>
<script>
const log = document.getElementById("log"), talk = document.getElementById("talk");
let messages = [], ctx, stream, source, proc, chunks = [], recording = false, busy = false, playAt = 0;

function add(cls, text) {
  const d = document.createElement("div"); d.className = cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

async function start() {
  if (recording || busy) return;
  ctx = ctx || new AudioContext();
  await ctx.resume();
  stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  source = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(4096, 1, 1);
  chunks = [];
  proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(proc); proc.connect(ctx.destination);
  recording = true; talk.classList.add("on"); talk.textContent = "أسمعك... شيل إصبعك إذا خلصت";
}

function to16k(parts, rate) {
  const n = parts.reduce((a, p) => a + p.length, 0), all = new Float32Array(n);
  let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
  const ratio = rate / 16000, out = new Int16Array(Math.floor(n / ratio));
  for (let i = 0; i < out.length; i++) {
    const x = i * ratio, j = Math.floor(x), f = x - j, s = all[j] * (1 - f) + (all[j + 1] || 0) * f;
    out[i] = Math.max(-1, Math.min(1, s)) * 32767;
  }
  return out;
}

function b64(int16) {
  const bytes = new Uint8Array(int16.buffer); let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function play(pcmB64, rate) {
  const raw = atob(pcmB64), n = raw.length / 2, buf = ctx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) { let v = raw.charCodeAt(2 * i) | (raw.charCodeAt(2 * i + 1) << 8); if (v >= 32768) v -= 65536; ch[i] = v / 32768; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  const at = Math.max(ctx.currentTime + 0.02, playAt); src.start(at); playAt = at + buf.duration;
  return at;
}

async function stop() {
  if (!recording) return;
  const released = performance.now();
  recording = false; talk.classList.remove("on"); source.disconnect(); proc.disconnect();
  const pcm = to16k(chunks, ctx.sampleRate);
  if (pcm.length < 16000 * 0.3) { talk.textContent = "اضغط مطولاً وتكلم (أو اضغط مسافة)"; return; }
  busy = true; talk.disabled = true; talk.textContent = "ساهر يفكر...";
  const you = add("msg user", "…"), bot = add("msg assistant", ""), info = add("times", "");
  let heard = "", reply = "", firstSound = null;
  try {
    const res = await fetch("/turn", { method: "POST", body: JSON.stringify({ pcm16: b64(pcm), messages }) });
    const reader = res.body.getReader(), dec = new TextDecoder(); let rest = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      rest += dec.decode(value, { stream: true });
      let k; while ((k = rest.indexOf("\n")) >= 0) {
        const e = JSON.parse(rest.slice(0, k)); rest = rest.slice(k + 1);
        if (e.type === "transcript") { heard = e.text; you.textContent = heard || "(ما سمعت شي)"; }
        else if (e.type === "text") { reply += e.delta; bot.textContent = reply; log.scrollTop = log.scrollHeight; }
        else if (e.type === "audio") { const at = play(e.pcm16, e.sample_rate); if (firstSound === null) firstSound = performance.now() - released + (at - ctx.currentTime) * 1000; }
        else if (e.type === "error") { bot.textContent = "صار خطأ: " + e.error; }
        else if (e.type === "done") {
          const t = e.times, f = v => v == null ? "-" : (v / 1000).toFixed(2) + "s";
          info.textContent = `transcribed ${f(t.transcribed)} · first text ${f(t.first_text)} · first audio ${f(t.first_audio)} · full reply ${f(t.full_reply)} · heard first sound ${f(firstSound)}`;
        }
      }
    }
    if (heard && reply) messages.push({ role: "user", content: heard }, { role: "assistant", content: reply.trim() });
    if (!reply) bot.remove();
  } catch (err) { bot.textContent = "صار خطأ: " + err; }
  busy = false; talk.disabled = false; talk.textContent = "اضغط مطولاً وتكلم (أو اضغط مسافة)";
}

talk.addEventListener("pointerdown", e => { e.preventDefault(); start(); });
talk.addEventListener("pointerup", stop);
talk.addEventListener("pointerleave", stop);
addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat) { e.preventDefault(); start(); } });
addEventListener("keyup", e => { if (e.code === "Space") { e.preventDefault(); stop(); } });
document.getElementById("reset").onclick = () => { messages = []; log.innerHTML = ""; };
document.getElementById("quit").onclick = async () => { await fetch("/quit", { method: "POST" }); document.body.innerHTML = "<main><h1>تم إيقاف ساهر</h1></main>"; };
</script>
</body>
</html>
